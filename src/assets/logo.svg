<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">logo</title>
  <desc id="desc">A rounded camera with a circular lens and a smiling yellow sticker overlapping the lower-right corner.</desc>

  <style>
    :root {
      --camera: #26313d;
      --outline: #ffffff;
      --photo-sky: #67c3ee;
      --sticker: #ffd23f;
      --face: #26313d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --camera: #e8edf2;
        --outline: #26313d;
        --face: #26313d;
      }
    }
  </style>

  <!-- Camera body: rounded overall silhouette, including the upper housing -->
  <path
    d="M48 72
       H68
       C74 72 79 68 82 62
       L90 48
       C92 44 96 42 101 42
       H155
       C160 42 164 44 166 48
       L174 62
       C177 68 182 72 188 72
       H208
       C221 72 232 83 232 98
       V188
       C232 203 221 214 206 214
       H50
       C35 214 24 203 24 188
       V98
       C24 83 35 72 48 72
       Z"
    fill="var(--camera)"
    stroke="var(--outline)"
    stroke-width="12"
    stroke-linejoin="round"
  />

  <!-- Lens/photo area -->
  <circle
    cx="122"
    cy="137"
    r="50"
    fill="var(--photo-sky)"
    stroke="var(--outline)"
    stroke-width="12"
  />

  <!-- Sun -->
  <circle
    cx="145"
    cy="116"
    r="11"
    fill="#ffffff"
  />

  <!-- Yellow sticker -->
  <circle
    cx="184"
    cy="181"
    r="49"
    fill="var(--sticker)"
    stroke="var(--outline)"
    stroke-width="10"
  />

  <ellipse
    cx="169"
    cy="171"
    rx="6"
    ry="10"
    fill="var(--face)"
  />
  <ellipse
    cx="198"
    cy="171"
    rx="6"
    ry="10"
    fill="var(--face)"
  />

  <path
    d="M163 187
       C170 201 193 204 205 187"
    fill="none"
    stroke="var(--face)"
    stroke-width="9"
    stroke-linecap="round"
  />
</svg>
